<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
</head>
<body>
          <header class="cabecera">
        <div class="cabecera__barra">

            <!-- Solo se ve en móvil -->
            <button type="button" class="menu-btn" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- En móvil está oculto hasta pulsar el botón -->
        <nav class="menu">
            <a href="index.html#inicio">HOME</a>
            <a href="index.html#novedades">NEW IN</a>
            <a href="tienda.html">STORE</a>
            <a href="index.html#eventos">EVENTS</a>
        </nav>
    </header>
        <div class="titulo-tienda"><a href="index.html"><h4>Tienda</h4></a></div>
    <main class="contenido">

        <!-- ============ FILTROS POR DÍA ============ -->
        <!-- Cada botón guarda en data-dia el día que filtra -->
        <nav class="filtros" aria-label="Filtrar por día">
            <button type="button" class="filtro is-activo" data-dia="Todos">Todos</button>
            <button type="button" class="filtro" data-dia="Pop/Rock internacional">Pop/Rock internacional</button>
            <button type="button" class="filtro" data-dia="Indie">Indie</button>
            <button type="button" class="filtro" data-dia="Rap">Rap</button>
        </nav>

        <p class="contador" id="contador"></p>

        <!-- ============ CARTEL ============ -->
        <section class="cartel" id="cartel"></section>
    </main>
    <footer>
        <h6>Gatefold</h6>
        
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
